# Unsigned Windows-only release for forks. Lives in its own file so merges from upstream
# never conflict: release.yml, build.yml and tauri.conf.json stay untouched.
#
# Forks don't have upstream's Azure / Tauri updater secrets, so this
# builds with sign-binaries: false and overrides tauri.conf.json at build time
# to drop the Azure signCommand and the updater artifacts (which would
# otherwise require upstream's TAURI_SIGNING_PRIVATE_KEY).
name: "Fork Release (Windows, unsigned)"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      # JSON merge patch on top of tauri.conf.json: null removes signCommand.
      build-args: >-
        ${{ matrix.args }} --config
        '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
      sign-binaries: false
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      no-cache: true
    secrets: inherit
